[project]
name = "ig-profile-to-rag"
version = "0.1.0"
description = "Extract knowledge from Instagram profiles and index into a vector database for RAG."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apify-client>=3.1.3",
    "browser-cookie3>=0.20.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.19.0",
    "instaloader>=4.15.3",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=14.0.0",
    "typer>=0.27.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
ig-rag = "main:main"
