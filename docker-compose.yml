version: '3.8'

services:
  instarag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instarag-api
    ports:
      - "${INSTARAG_PORT:-8000}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - APIFY_API_KEY=${APIFY_API_KEY}
      - INSTARAG_DATABASE_URL=${INSTARAG_DATABASE_URL:-sqlite:////data/config/instarag.db}
      - INSTARAG_API_KEY=${INSTARAG_API_KEY:-}
      - INSTARAG_CORS_ORIGINS=${INSTARAG_CORS_ORIGINS:-*}
    volumes:
      - instarag_data:/data
    restart: unless-stopped

volumes:
  instarag_data:
    driver: local
